name: Release

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type release to run release gates"
        required: true

jobs:
  release-gates:
    if: github.event.inputs.confirm == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint --max-warnings=0
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm api:check
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps
      - run: pnpm test:e2e
      - run: pnpm test:a11y
      - run: pnpm test:performance
      - name: Manual evidence checklist slots
        run: |
          echo "Attach devices.md, accessibility.md, security-audit.md, and release-readiness.md before promoting."
